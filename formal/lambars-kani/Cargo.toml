[package]
name = "lambars-kani"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
publish = false
description = "Kani model-checking backend for Lambars production-readiness specifications"

[dependencies]
lambars = { path = "../..", features = ["full", "arc", "rayon", "fxhash", "ahash"] }
lambars-spec = { path = "../lambars-spec" }
lambars-formal-macros = { path = "../lambars-formal-macros" }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
