name: Kani verification

on:
  pull_request:
    paths:
      - "src/**"
      - "lambars-verification/**"
      - "lambars-verify-macros/**"
      - "verification/kani/**"
      - "verification/tools/**"
      - ".github/workflows/kani-verification.yml"

  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Kani harnesses
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: "0.67.0"
          command: "cargo-kani"
          working-directory: "verification/kani"

  repetition-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build structural repetition inventory
        run: |
          python verification/tools/find_repetition.py             src lambars-verification lambars-verify-macros verification/kani verification/verus             --json target/verification/repetition.json
      - name: Upload repetition inventory
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verification-repetition-inventory
          path: target/verification/repetition.json
