name: Security Assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address-sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Install pinned nightly with rust-src
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned
        with:
          toolchain: nightly-2025-12-15
          components: rust-src

      - name: Run test suite under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: >-
          cargo +nightly-2025-12-15 test
          --all-features
          --lib
          --tests
          --target x86_64-unknown-linux-gnu
          -Zbuild-std

  fuzz:
    name: Bounded fuzz regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned
        with:
          toolchain: nightly-2025-12-15

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz persistent collections
        run: cargo +nightly-2025-12-15 fuzz run persistent_collections --fuzz-dir fuzz -- -max_total_time=20

      - name: Fuzz total Lazy paths
        run: cargo +nightly-2025-12-15 fuzz run lazy_totality --fuzz-dir fuzz -- -max_total_time=20

      - name: Fuzz total Freer interpreter
        run: cargo +nightly-2025-12-15 fuzz run freer_totality --fuzz-dir fuzz -- -max_total_time=20

  architecture:
    name: Architecture (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Install exact MSRV target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Check full library for target
        run: cargo +1.92.0 check --all-features --lib --target ${{ matrix.target }}

  codeql:
    name: CodeQL (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
