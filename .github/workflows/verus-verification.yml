name: Verus verification

on:
  pull_request:
    paths:
      - "src/**"
      - "lambars-derive/**"
      - "verification/verus/**"
      - ".github/workflows/verus-verification.yml"
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERUS_VERSION: "0.2026.09.20.aef82ed"

jobs:
  verus:
    name: Verus proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Verus Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot
        with:
          toolchain: "1.98.1"

      - name: Install pinned Verus release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            --output /tmp/verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q /tmp/verus.zip -d /tmp
          chmod +x /tmp/verus-x86-linux/verus /tmp/verus-x86-linux/cargo-verus
          echo "/tmp/verus-x86-linux" >> "$GITHUB_PATH"

      - name: Verify Verus obligations
        working-directory: verification/verus
        run: cargo verus verify
