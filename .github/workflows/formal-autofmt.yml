name: Formal Autoformat

on:
  push:
    branches:
      - "formal/**"
    paths:
      - "formal/**/*.rs"
      - "xtask/**/*.rs"
      - "Cargo.toml"
      - "formal/**/Cargo.toml"
      - ".github/workflows/formal-autofmt.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-15
          components: rustfmt

      - name: Format workspace Rust sources
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: cargo fmt formal verification sources"
          git push origin "HEAD:${{ github.ref_name }}"
