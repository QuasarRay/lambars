name: Safety Dynamic Analysis

on:
  pull_request:
    paths:
      - "src/**"
      - "lambars-derive/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/safety-analysis.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address-sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-01
      - name: Run test suite under ASan
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
        run: cargo +nightly-2026-09-01 test --all-features --tests --locked

  fuzz-smoke:
    name: libFuzzer bounded smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-01
      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-09-01 install cargo-fuzz --version 0.12.0 --locked
      - name: Fuzz persistent collection invariants
        working-directory: fuzz
        run: cargo +nightly-2026-09-01 fuzz run persistent_collections -- -max_total_time=30 -rss_limit_mb=2048

  architecture-check:
    name: Architecture check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install exact MSRV and target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}
      - name: Cross-architecture type check
        run: cargo +1.92.0 check --all-features --lib --tests --locked --target ${{ matrix.target }}

  codeql:
    name: CodeQL Rust security-extended
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
