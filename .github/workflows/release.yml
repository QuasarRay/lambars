name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always
  VERUS_VERSION: "0.2026.09.20.aef82ed"
  SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}

jobs:
  qualification:
    name: Safety qualification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require SC-001 through SC-040 closed
        run: python verification/tools/check_qualification.py

  verify:
    name: Release source verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify tag versions
        run: |
          ROOT_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="lambars") | .version')
          DERIVE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="lambars-derive") | .version')
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          test "$ROOT_VERSION" = "$TAG_VERSION"
          test "$DERIVE_VERSION" = "$TAG_VERSION"
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-features --all-targets -- -D warnings
      - name: Test all features
        run: cargo test --all-features --locked
      - name: Verify package surfaces
        run: python verification/tools/check_package_contents.py
      - name: Install pinned dependency policy tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Enforce dependency policy
        run: |
          cargo audit --deny warnings
          cargo deny check
      - name: Enforce unsafe boundary
        run: python verification/tools/check_unsafe_boundary.py

  kani:
    name: Release Kani proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: "0.67.0"
          command: "cargo-kani"
          working-directory: "verification/kani"

  verus:
    name: Release Verus proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot
        with:
          toolchain: "1.98.1"
      - name: Install pinned Verus release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q /tmp/verus.zip -d /tmp
          chmod +x /tmp/verus-x86-linux/verus /tmp/verus-x86-linux/cargo-verus
          echo "/tmp/verus-x86-linux" >> "$GITHUB_PATH"
      - name: Verify Verus obligations
        working-directory: verification/verus
        run: cargo verus verify

  build-evidence:
    name: Build reproducible release evidence
    needs: [qualification, verify, kani, verus]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Derive deterministic source epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --override-filename sbom.cdx.json

      - name: Build release library
        run: cargo build --release --all-features --locked

      - name: Package public crates first pass
        run: |
          rm -rf target/package
          cargo package -p lambars-derive --locked --no-verify
          cargo package -p lambars --locked --no-verify
          mkdir -p /tmp/package-pass-1
          cp target/package/*.crate /tmp/package-pass-1/
          (cd /tmp/package-pass-1 && sha256sum *.crate | sort) > /tmp/package-pass-1.sha256

      - name: Package public crates second pass and compare
        run: |
          rm -rf target/package
          cargo package -p lambars-derive --locked --no-verify
          cargo package -p lambars --locked --no-verify
          (cd target/package && sha256sum *.crate | sort) > /tmp/package-pass-2.sha256
          diff -u /tmp/package-pass-1.sha256 /tmp/package-pass-2.sha256

      - name: Record release evidence
        run: |
          mkdir -p release-evidence
          cp target/package/*.crate release-evidence/
          cp sbom.cdx.json release-evidence/
          git rev-parse HEAD > release-evidence/source-commit.txt
          rustc --version --verbose > release-evidence/rustc.txt
          cargo --version --verbose > release-evidence/cargo.txt
          cp verification/qualification.json release-evidence/
          find target/release/deps -maxdepth 1 -type f -name 'liblambars*.rlib' -exec cp {} release-evidence/ \;
          (cd release-evidence && sha256sum *.crate *.rlib sbom.cdx.json qualification.json | sort) > release.sha256
          mv release.sha256 release-evidence/

      - name: Attest build provenance and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-evidence/*.crate
            release-evidence/*.rlib
          sbom-path: release-evidence/sbom.cdx.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified crates
    needs: [qualification, verify, kani, verus, build-evidence]
    runs-on: ubuntu-latest
    environment: crates-io-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Publish derive crate first
        run: cargo publish -p lambars-derive --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
      - name: Publish root crate
        run: cargo publish -p lambars --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  create-release:
    name: Create GitHub Release with evidence
    needs: [publish, build-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
      - name: Generate changelog for release
        id: git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            release-evidence/*
