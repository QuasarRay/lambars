name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (Rust 1.92.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify pinned toolchain
        run: rustc --version | grep -F "rustc 1.92.0"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Check (no features)
        run: cargo check --no-default-features
      - name: Check (all features)
        run: cargo check --all-features

  test:
    name: Test (Rust 1.92.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify pinned toolchain
        run: rustc --version | grep -F "rustc 1.92.0"
      - name: Run tests (no features)
        run: cargo test --no-default-features
      - name: Run tests (all features)
        run: cargo test --all-features

  portability:
    name: Portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify pinned toolchain
        shell: bash
        run: rustc --version | grep -F "rustc 1.92.0"
      - name: Check library on host platform
        run: cargo check --all-features --lib

  loom:
    name: Loom concurrency model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Loom models
        env:
          LOOM_MAX_PREEMPTIONS: "3"
        run: cargo test --test concurrent_lazy_loom_tests --features control -- --nocapture

  coverage:
    name: Code Coverage (>= 80% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install LLVM tools
        run: rustup component add llvm-tools-preview --toolchain 1.92.0
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce code coverage floor
        run: cargo llvm-cov --all-features --fail-under-lines 80 --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum Supported Rust Version (exact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert exact MSRV
        run: |
          rustc --version
          rustc --version | grep -F "rustc 1.92.0"
          grep -F 'rust-version = "1.92.0"' Cargo.toml
      - name: Check MSRV
        run: cargo check --all-features


  miri:
    name: Miri unsafe-boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned nightly with Miri
        run: rustup toolchain install nightly-2025-12-15 --profile minimal --component miri
      - name: Run Miri on control subsystem
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        run: cargo +nightly-2025-12-15 miri test --lib --features control

  dependency-policy:
    name: Dependency advisories licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned dependency-policy tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: RustSec audit
        run: cargo audit --deny warnings
      - name: cargo-deny policy
        run: cargo deny check

  unsafe-boundary:
    name: Unsafe code boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce audited unsafe boundary
        run: python verification/tools/check_unsafe_boundary.py

  verifier-smoke:
    name: Excluded verifier crates compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and run Kani crate runtime regressions
        run: cargo test --manifest-path verification/kani/Cargo.toml
      - name: Compile Verus crate with its pinned toolchain
        working-directory: verification/verus
        run: cargo check
