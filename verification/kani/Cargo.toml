[workspace]

[package]
name = "lambars-kani-verification"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lambars_alias = { package = "lambars", path = "../..", features = ["serde", "arc"] }
lambars-verification = { path = "../../lambars-verification" }
lambars-derive = { path = "../../lambars-derive" }
static_assertions = "1.1"

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
